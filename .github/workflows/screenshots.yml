name: App screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'aes/**/*.js'
      - 'scripts/**'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Capture examples
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/cryptoapps-http.log 2>&1 &
          node scripts/screenshots.cjs
      - name: Save screenshots in the tool folders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- */screenshot.png scripts/screenshot-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add app screenshots to tool documentation'
          git push origin HEAD:main
      - name: Check browser results
        run: node -e "const r=require('./scripts/screenshot-results.json');if(r.some(x=>x.status!=='passed'))process.exit(1)"
