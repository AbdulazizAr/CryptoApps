<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Vigenère Cipher Tool</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
    .label { font-weight: bold; margin-top: 20px; }
    .output { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
<nav style="margin: 0 0 20px; font: 14px system-ui"><a href="../index.html">← All CryptoApps</a> · Educational use only</nav>
  <h2>🔐 Vigenère Cipher Tool</h2>

  <div class="label">🔤 Custom Alphabet:</div>
  <input type="text" id="vigenereAlphabet" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ" placeholder="Enter your custom alphabet (e.g. ABCDEFGHIJKLMNOPQRSTUVWXYZ)">

  <div class="label">📝 Plaintext:</div>
  <textarea id="vigenerePlaintext" rows="3" placeholder="Enter plaintext"></textarea>

  <div class="label">🔑 Key:</div>
  <textarea id="vigenereKey" rows="2" placeholder="Enter key"></textarea>

  <div class="label">🔒 Ciphertext:</div>
  <textarea id="vigenereCiphertext" rows="3" placeholder="Enter ciphertext"></textarea>

  <p id="cipherStatus" role="status" style="color:#a32626"></p>
  <button id="recoverKey" type="button">Recover keystream from plaintext and ciphertext</button>
  <p>Automatic updates follow the text field you edit. To recover a keystream, clear the key first, then enter both texts.</p>
  <script>
    const alphaField = document.getElementById('vigenereAlphabet');
    const plainField = document.getElementById('vigenerePlaintext');
    const keyField = document.getElementById('vigenereKey');
    const cipherField = document.getElementById('vigenereCiphertext');
    const statusField = document.getElementById('cipherStatus');
    let direction = 'encrypt';
    [alphaField, plainField, keyField, cipherField].forEach(field => field.addEventListener('input', syncFields));
    function syncFields(event) {
      if (event?.target === plainField) direction = 'encrypt';
      if (event?.target === cipherField) direction = 'decrypt';
      const source = direction === 'encrypt' ? plainField : cipherField;
      const target = direction === 'encrypt' ? cipherField : plainField;
      const alphabet = alphaField.value, text = source.value, key = keyField.value;
      if (key) target.value = '';
      statusField.textContent = '';
      if (alphabet.length < 2 || new Set(alphabet).size !== alphabet.length || /[\uD800-\uDFFF]/.test(alphabet)) {
        statusField.textContent = 'Use an alphabet of at least two unique BMP characters.'; return;
      }
      if (!text || !key) { statusField.textContent = 'Enter a message and key.'; return; }
      if ([...text + key].some(c => !alphabet.includes(c))) {
        statusField.textContent = 'Every message and key character must appear in the alphabet. Use uppercase letters with the default alphabet.'; return;
      }
      
      const sign = direction === 'encrypt' ? 1 : -1;
      target.value = [...text].map((c,i) => {
        const value = alphabet.indexOf(c) + sign * alphabet.indexOf(key[i % key.length]);
        return alphabet[(value % alphabet.length + alphabet.length) % alphabet.length];
      }).join('');
    }

    document.getElementById('recoverKey').addEventListener('click', () => {
      const a = alphaField.value, p = plainField.value, c = cipherField.value;
      if (a.length < 2 || new Set(a).size !== a.length || /[\uD800-\uDFFF]/.test(a) || !p || p.length !== c.length || [...p+c].some(x => !a.includes(x))) {
        statusField.textContent = 'Use a unique alphabet and two equal length texts containing only alphabet characters.'; return;
      }
      keyField.value = [...p].map((x,i) => a[(a.indexOf(c[i])-a.indexOf(x)+a.length)%a.length]).join('');
      statusField.textContent = 'Recovered the full keystream, which may contain repeated key characters.';
    });
  </script>
</body>
</html>
